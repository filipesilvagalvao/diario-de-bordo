<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <script type="module" src="/js/script.js"></script>
    <title>Diário de Bordo</title>
</head>
<body>
    <main class="logbook">
        <form class="logbook__form">
            <input 
                type="text" 
                name="" 
                id="" 
                class="logbook__inputTitle" 
                placeholder="Título"
                required
            >

            <input 
                type="date" 
                name="" 
                id="" 
                class="logbook__formDate"
                required
            >

            <textarea 
                name="" 
                id="" 
                class="logbook__formText" 
                placeholder="Descrição"
                required
            ></textarea>
            
            <button 
                class="logbook__formSend"
                type="submit"
            >Add</button>
        </form>
        <section class="logbook__list">

        </section>
    </main>
</body>
</html>
