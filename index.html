<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <script type="module" src="/js/script.js"></script>
    <title>Diário de Bordo</title>
</head>
<body>
    <main class="logbook">
        <h1 class="logbook__title">Diário de bordo</h1>
        <form class="logbook__form">
            <input 
                type="text" 
                name="" 
                id="" 
                class="logbook__inputTitle" 
                placeholder="Título"
                required
            >

            <input 
                type="date" 
                name="" 
                id="" 
                class="logbook__formDate"
                required
            >

            <textarea 
                name="" 
                id="" 
                class="logbook__formText" 
                placeholder="Descrição"
                required
            ></textarea>
            
            <button
                class="logbook__formSend"
                type="submit"
            ><i class="fa-solid fa-circle-plus"></i> Adicionar</button>
        </form>
        <section class="logbook__list">

        </section>
    </main>
</body>
</html>
